[project]
name = "sap-timetracking"
version = "0.1.0"
description = "SAP time-tracking automation via keyboard input"
requires-python = ">=3.11"
dependencies = [
    "pyautogui>=0.9.54",
]

[project.scripts]
sap-timetracking = "sap_timetracking.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
